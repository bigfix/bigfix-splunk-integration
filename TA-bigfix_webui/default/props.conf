[bigfix:webui]
category = BigFix
pulldown_type = 1
description = Parsing rules for BigFix WebUI Service Wrapper logs

SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=[A-Z][a-z]{2},\s\d{2}\s[A-Z][a-z]{2}\s\d{4}\s\d{2}:\d{2}:\d{2}\s[+-]\d{4}\s--)
TRUNCATE = 10000

TIME_PREFIX = ^
TIME_FORMAT = %a, %d %b %Y %H:%M:%S %z
MAX_TIMESTAMP_LOOKAHEAD = 35

[bigfix:webui:insights]
DESCRIPTION = BigFix Insights ETL Log Parsing

SHOULD_LINEMERGE = false
LINE_BREAKER = (?<=\{\"timestamp\":\"\d{4}-\d{2}-\d{2}\s\d{2}:\d{2}:\d{2}\"\})([\r\n]+)

TIME_PREFIX = \{"timestamp":"
TIME_FORMAT = %Y-%m-%d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 300000

TRUNCATE = 300000

ANNOTATE_PUNCT = false
KV_MODE = none