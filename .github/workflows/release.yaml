name: Release

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create tar archive of bigfix folder
        run: tar -cf bigfix.tar bigfix

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: bigfix
          path: bigfix.tar

      - name: Attach archive to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" bigfix.tar
