[bigfix:webreports]
category = BigFix
pulldown_type = 1
description = Parsing rules for BigFix Web Reports logs

SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=[A-Z][a-z]{2},\s\d{2}\s[A-Z][a-z]{2}\s\d{4}\s\d{2}:\d{2}:\d{2}\s[+-]\d{4}\s--)
TRUNCATE = 10000

TIME_PREFIX = ^
TIME_FORMAT = %a, %d %b %Y %H:%M:%S %z
MAX_TIMESTAMP_LOOKAHEAD = 35